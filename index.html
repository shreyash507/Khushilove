<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page" id="page1">
    <h1 class="fade">Heyyyyy Rasmalai ❤️</h1>
    <p class="fade">I was thinking about you, so I made this</p>
    <button onclick="startExperience()">Next →</button>
  </div>

  <div class="page hidden" id="page2">
    <img src="photo.jpg" class="photo fade" alt="Our Photo">
    <p class="fade">
      We really need to take more good pictures haha.<br>
      Falling very short on this task right now.
    </p>
    <button onclick="nextPage(3)">Next →</button>
  </div>

  <div class="page hidden" id="page3">
    <div class="love-note">
      <p class="fade">I’m so glad HOP happened... (rest of your text)</p>
      </div>
    <button onclick="nextPage(4)">Next →</button>
  </div>

  <div class="page hidden" id="page4">
    <h1 class="fade">Will you be my Valentine? 💖</h1>
    <button onclick="yes()">Yes 💕</button>
    <button onmouseover="moveNo(this)" id="noBtn">No 😐</button>
  </div>

  <div class="page hidden" id="page5">
    <h1 class="fade">YAYYYYYYYYY ❤️</h1>
    <p class="fade">You just made me the happiest person.</p>
  </div>

  <audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <button id="musicToggle" onclick="toggleMusic()">🎶</button>

  <script src="script.js"></script>
</body>
</html>
